<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-label="蘿蔔玉米排骨湯成品插畫：一碗清甜湯頭，裡面有蘿蔔塊、玉米、娃娃菜、紅棗與枸杞">
  <defs>
    <filter id="rough" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="4" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="roughS" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="9" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0" result="d"/>
      <feComponentTransfer in="d" result="a"><feFuncA type="table" tableValues="0 0.42"/></feComponentTransfer>
      <feComposite in="a" in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="wash" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#FFF3DF" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#FFF3DF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="kern" width="19" height="19" patternUnits="userSpaceOnUse">
      <rect width="19" height="19" fill="#E5A434"/>
      <ellipse cx="5" cy="5" rx="6.2" ry="5.6" fill="#F9D878"/>
      <ellipse cx="14.5" cy="14.5" rx="6.2" ry="5.6" fill="#F9D878"/>
      <ellipse cx="24" cy="5" rx="6.2" ry="5.6" fill="#F9D878"/>
      <ellipse cx="-4.5" cy="14.5" rx="6.2" ry="5.6" fill="#F9D878"/>
      <ellipse cx="5" cy="24" rx="6.2" ry="5.6" fill="#F9D878"/>
      <ellipse cx="14.5" cy="-4.5" rx="6.2" ry="5.6" fill="#F9D878"/>
    </pattern>
    <clipPath id="broth"><ellipse cx="400" cy="252" rx="236" ry="74"/></clipPath>
    <clipPath id="bowlBody"><path d="M164 250 C170 364 250 456 400 456 C550 456 630 364 636 250 Z"/></clipPath>
    <g id="goji">
