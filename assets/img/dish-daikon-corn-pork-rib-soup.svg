      <path d="M4 -11 C7 -6 7 7 3 12 C6 10 8 6 8 0 C8 -6 7 -9 4 -11 Z" fill="#B23F18"/>
      <path d="M0 -13 C5 -13 8 -8 8 0 C8 9 4 13 0 13 C-4 13 -8 9 -8 0 C-8 -8 -5 -13 0 -13 Z" fill="none" stroke="#9A3412" stroke-width="1.8"/>
    </g>
  </defs>

  <ellipse cx="400" cy="262" rx="396" ry="258" fill="url(#wash)"/>

