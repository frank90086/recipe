<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="薑片插畫">
  <defs>
    <filter id="r" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="g" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="13" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0" result="d"/>
      <feComponentTransfer in="d" result="a"><feFuncA type="table" tableValues="0 0.5"/></feComponentTransfer>
      <feComposite in="a" in2="SourceGraphic" operator="in"/>
    </filter>
    <g id="slice">
      <path d="M-34 0 C-34 -16 -18 -26 0 -26 C20 -26 34 -15 34 2 C34 17 18 26 -2 25 C-20 24 -34 15 -34 0 Z" fill="#F0DBA8"/>
      <path d="M20 -22 C30 -12 30 14 16 24 C28 22 34 13 34 2 C34 -10 29 -19 20 -22 Z" fill="#DEC48A"/>
      <path d="M-26 -8 C-20 -18 -6 -22 6 -21" stroke="#F8EDCB" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>
      <g stroke="#CDAE74" stroke-width="2" stroke-linecap="round" fill="none" opacity=".75">
        <path d="M-18 -10 C-8 -4 6 -2 20 -6"/>
        <path d="M-16 6 C-4 12 10 12 24 8"/>
      </g>
      <path d="M-34 0 C-34 -16 -18 -26 0 -26 C20 -26 34 -15 34 2 C34 17 18 26 -2 25 C-20 24 -34 15 -34 0 Z" fill="none" stroke="#B89355" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </defs>
  <g filter="url(#r)">
    <use href="#slice" transform="translate(66 48) rotate(-12)"/>
    <use href="#slice" transform="translate(88 86) rotate(9)"/>
    <use href="#slice" transform="translate(62 118) rotate(-5)"/>
  </g>
  <g filter="url(#g)" style="mix-blend-mode:multiply" opacity=".45">
    <ellipse cx="66" cy="48" rx="34" ry="26" fill="#9c7c3c"/>
    <ellipse cx="88" cy="86" rx="34" ry="26" fill="#9c7c3c"/>
    <ellipse cx="62" cy="118" rx="34" ry="26" fill="#9c7c3c"/>
  </g>
</svg>
